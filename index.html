<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amadeus Advanced UI</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 16px 40px;
            background: white;
        }

        .logo {
            font-weight: bold;
        }

        .hero {
            position: relative;
            overflow: hidden;
            color: white;
            padding: 120px 40px;
            background: #001a3d;
        }


        .wave {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, #0077ff, transparent),
                radial-gradient(circle at 70% 70%, #00c6ff, transparent);
            animation: waveMove 8s infinite linear;
            opacity: 0.4;
        }

        @keyframes waveMove {
            0% {
                transform: translateX(0) rotate(0deg);
            }

            50% {
                transform: translateX(-25%) rotate(180deg);
            }

            100% {
                transform: translateX(0) rotate(360deg);
            }
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 40px;
        }

        .hero button {
            padding: 12px 20px;
            margin-top: 20px;
            background: white;
            border: none;
            border-radius: 6px;
        }


        .carousel {
            position: relative;
            overflow: hidden;
            height: 250px;
        }

        .slides {
            display: flex;
            transition: transform 0.5s ease;
        }

        .slide {
            min-width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: #002f6c;
            color: white;
        }

        .controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }

        .controls button {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        .about {
            text-align: center;
            padding: 60px 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .stat b {
            display: block;
            font-size: 28px;
            color: #2b6cb0;
        }

        
        .contact {
            padding: 60px 20px;
            background: #f4f6f9;
        }

        .contact-form {
            max-width: 500px;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .contact-form input,
        .contact-form textarea {
            padding: 10px;
        }

        
        @media (max-width: 768px) {
            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .hero h1 {
                font-size: 26px;
            }
        }

        @media (max-width: 480px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div class="logo">AMADEUS</div>
    </div>
    <div class="hero">
        <div class="wave"></div>

        <div class="hero-content">
            <h1>How can AI transform travel at scale?</h1>
            <button>Learn more</button>
        </div>
    </div>
    <div class="carousel">
        <div class="slides" id="slides">
            <div class="slide">AI Solutions</div>
            <div class="slide">Cloud Technologies</div>
            <div class="slide">Sustainability</div>
        </div>

        <div class="controls">
            <button onclick="prevSlide()">❮</button>
            <button onclick="nextSlide()">❯</button>
        </div>
    </div>
    <div class="about">
        <h2>At the heart of travel</h2>
        <p>Amadeus technology powers the global travel and tourism industry.</p>

        <div class="stats">
            <div class="stat"><b>400+</b>Airlines</div>
            <div class="stat"><b>2M+</b>Hotels</div>
            <div class="stat"><b>210</b>Airports</div>
            <div class="stat"><b>230</b>Operators</div>
        </div>
    </div>
    <div class="contact">
        <h2>Contact Us</h2>
        <div class="contact-form">
            <input placeholder="Name">
            <input placeholder="Email">
            <textarea placeholder="Message"></textarea>
            <button>Send</button>
        </div>
    </div>
    <script>
        let index = 0;
        function showSlide() {
            const slides = document.getElementById("slides");
            slides.style.transform = `translateX(-${index * 100}%)`;
        }

        function nextSlide() {
            index = (index + 1) % 3;
            showSlide();
        }

        function prevSlide() {
            index = (index - 1 + 3) % 3;
            showSlide();
        }
        setInterval(() => {
            nextSlide();
        }, 3000);
    </script>
</body>
</html>
