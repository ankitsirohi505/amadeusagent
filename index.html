<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amadeus UI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 16px 40px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-weight: bold;
        }

        /* HERO */
        .hero {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0b3d6e, #001a3d);
            color: white;
            padding: 120px 60px;
            min-height: 70vh;
            display: flex;
            align-items: center;
        }

        .hero-content {
            z-index: 2;
            max-width: 600px;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .hero button {
            padding: 12px 20px;
            background: white;
            border: none;
            border-radius: 6px;
        }

        /* WAVE */
        .wave {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, #0077ff, transparent),
                radial-gradient(circle at 70% 70%, #00c6ff, transparent);
            animation: waveMove 10s infinite linear;
            opacity: 0.25;
        }

        @keyframes waveMove {
            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(-25%);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* CAROUSEL */
        .carousel {
            overflow: hidden;
            height: 220px;
            background: #002f6c;
        }

        .slides {
            display: flex;
            transition: transform 0.5s ease;
        }

        .slide {
            min-width: 100%;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ABOUT */
        .about {
            padding: 60px 20px;
            text-align: center;
            background: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
            margin-top: 30px;
        }

        .stat b {
            display: block;
            font-size: 28px;
            color: #2b6cb0;
        }

        /* CONTACT */
        .contact {
            padding: 60px 20px;
            text-align: center;
        }

        .contact h2 {
            margin-bottom: 20px;
        }

        /* FORM */
        .contact-form {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        /* GRID FORM */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full {
            grid-column: span 2;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            display: block;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button.submit-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #2f855a;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: span 1;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">AMADEUS</div>
    </div>

    <!-- HERO -->
    <div class="hero">
        <div class="wave"></div>
        <div class="hero-content">
            <h1>How can AI transform travel at scale?</h1>
            <button>Learn more</button>
        </div>
    </div>

    <!-- CAROUSEL -->
    <div class="carousel">
        <div class="slides" id="slides">
            <div class="slide">AI Solutions</div>
            <div class="slide">Cloud Technologies</div>
            <div class="slide">Sustainability</div>
        </div>
    </div>

    <!-- ABOUT -->
    <div class="about">
        <h2>At the heart of travel</h2>
        <p>Amadeus powers global travel technology.</p>

        <div class="stats">
            <div><b>400+</b>Airlines</div>
            <div><b>2M+</b>Hotels</div>
            <div><b>210</b>Airports</div>
            <div><b>230</b>Operators</div>
        </div>
    </div>

    <!-- CONTACT (WEB TO LEAD) -->
    <div class="contact">
        <h2>Contact Us</h2>

        <form class="contact-form"
            action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DKZ00000BQiip"
            method="POST">

            <input type="hidden" name="oid" value="00DKZ00000BQiip">
            <input type="hidden" name="retURL" value="https://ankitsirohi505.github.io/amadeusagent/thankyou.html">

            <div class="form-grid">

                <!-- Name -->
                <div>
                    <label>First Name</label>
                    <input name="first_name">
                </div>

                <div>
                    <label>Last Name</label>
                    <input name="last_name" required>
                </div>

                <!-- Email + Company -->
                <div>
                    <label>Email</label>
                    <input name="email" type="email">
                </div>

                <div>
                    <label>Company</label>
                    <input name="company" required>
                </div>

                <!-- Title -->
                <div>
                    <label>Title</label>
                    <input name="title">
                </div>

                <!-- Industry (FULL SALESFORCE LIST) -->
                <div>
                    <label>Industry</label>
                    <select name="industry">
                        <option value="">--None--</option>
                        <option value="Agriculture">Agriculture</option>
                        <option value="Apparel">Apparel</option>
                        <option value="Banking">Banking</option>
                        <option value="Biotechnology">Biotechnology</option>
                        <option value="Chemicals">Chemicals</option>
                        <option value="Communications">Communications</option>
                        <option value="Construction">Construction</option>
                        <option value="Consulting">Consulting</option>
                        <option value="Education">Education</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Energy">Energy</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Environmental">Environmental</option>
                        <option value="Food & Beverage">Food & Beverage</option>
                        <option value="Government">Government</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Hospitality">Hospitality</option>
                        <option value="Insurance">Insurance</option>
                        <option value="Manufacturing">Manufacturing</option>
                        <option value="Media">Media</option>
                        <option value="Retail">Retail</option>
                        <option value="Technology">Technology</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Travel & Tourism">Travel & Tourism</option>
                    </select>
                </div>

                <!-- Address Fields -->
                <div class="full">
                    <label>Street</label>
                    <textarea name="street"></textarea>
                </div>

                <div>
                    <label>City</label>
                    <input name="city">
                </div>

                <div>
                    <label>State</label>
                    <input name="state">
                </div>

                <div>
                    <label>Zip</label>
                    <input name="zip">
                </div>

                <div>
                    <label>Country</label>
                    <input name="country">
                </div>

                <!-- Description -->
                <div class="full">
                    <label>Description</label>
                    <textarea name="description" rows="4"></textarea>
                </div>

            </div>

            <button class="submit-btn" type="submit">Submit</button>

        </form>
    </div>

    <script>
        let index = 0;
        function nextSlide() {
            index = (index + 1) % 3;
            document.getElementById("slides").style.transform =
                `translateX(-${index * 100}%)`;
        }
        setInterval(nextSlide, 3000);
    </script>

</body>

</html>
