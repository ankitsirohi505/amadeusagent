<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amadeus UI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 16px 40px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-weight: bold;
            font-size: 18px;
        }

        /* HERO */
        .hero {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #0b3d6e, #001a3d);
            color: white;
            padding: 120px 60px;
            display: flex;
            align-items: center;
            min-height: 70vh;
        }

        .hero-content {
            max-width: 600px;
            z-index: 2;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero button {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            background: white;
            cursor: pointer;
            font-weight: 600;
        }

        /* WAVE BACKGROUND */
        .wave {
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, #0077ff, transparent),
                radial-gradient(circle at 70% 70%, #00c6ff, transparent);
            animation: waveMove 10s infinite linear;
            opacity: 0.25;
        }

        @keyframes waveMove {
            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(-25%);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* CAROUSEL */
        .carousel {
            position: relative;
            overflow: hidden;
            height: 220px;
            background: #002f6c;
        }

        .slides {
            display: flex;
            transition: transform 0.5s ease;
        }

        .slide {
            min-width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
        }

        .controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
        }

        .controls button {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        /* ABOUT */
        .about {
            padding: 60px 20px;
            text-align: center;
            background: white;
        }

        .about h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .stats {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px;
        }

        .stat {
            font-size: 16px;
        }

        .stat b {
            display: block;
            font-size: 28px;
            color: #2b6cb0;
        }

        /* CONTACT */
        .contact {
            padding: 60px 20px;
            text-align: center;
        }

        .contact h2 {
            margin-bottom: 20px;
        }

        /* FORM */
        .contact-form {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);

            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-form input,
        .contact-form textarea {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 100%;
        }

        .contact-form button {
            padding: 12px;
            background: #2f855a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .hero h1 {
                font-size: 32px;
            }
        }

        @media (max-width: 600px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .hero {
                padding: 80px 20px;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="logo">AMADEUS</div>
    </div>

    <!-- HERO -->
    <div class="hero">
        <div class="wave"></div>

        <div class="hero-content">
            <h1>How can AI transform travel at scale?</h1>
            <button>Learn more</button>
        </div>
    </div>

    <!-- CAROUSEL -->
    <div class="carousel">
        <div class="slides" id="slides">
            <div class="slide">AI Solutions</div>
            <div class="slide">Cloud Technologies</div>
            <div class="slide">Sustainability</div>
        </div>

        <div class="controls">
            <button onclick="prevSlide()">❮</button>
            <button onclick="nextSlide()">❯</button>
        </div>
    </div>

    <!-- ABOUT -->
    <div class="about">
        <h2>At the heart of travel</h2>
        <p>Amadeus technology powers the global travel ecosystem.</p>

        <div class="stats">
            <div class="stat"><b>400+</b>Airlines</div>
            <div class="stat"><b>2M+</b>Hotels</div>
            <div class="stat"><b>210</b>Airports</div>
            <div class="stat"><b>230</b>Operators</div>
        </div>
    </div>

    <!-- CONTACT -->
    <div class="contact">
        <h2>Contact Us</h2>

        <div class="contact-form">
            <input type="text" placeholder="Your Name">
            <input type="email" placeholder="Your Email">
            <textarea rows="5" placeholder="Your Message"></textarea>
            <button>Send Message</button>
        </div>
    </div>

    <script>
        let index = 0;

        function showSlide() {
            const slides = document.getElementById("slides");
            slides.style.transform = `translateX(-${index * 100}%)`;
        }

        function nextSlide() {
            index = (index + 1) % 3;
            showSlide();
        }

        function prevSlide() {
            index = (index - 1 + 3) % 3;
            showSlide();
        }

        setInterval(nextSlide, 3000);
    </script>

</body>

</html>
